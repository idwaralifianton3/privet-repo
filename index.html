<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ruang Curhat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
      background: #f5f3f7;
    }
    h1 {
      color: #4a4458;
      font-size: 22px;
    }

    /* Kotak tempat pesan-pesan muncul */
    #chat-box {
      background: white;
      border-radius: 10px;
      padding: 15px;
      height: 400px;
      overflow-y: auto; /* bisa di-scroll kalau pesan banyak */
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Style dasar untuk setiap gelembung pesan */
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 75%;
      line-height: 1.4;
    }

    /* Pesan dari kamu -> rata kanan, warna ungu */
    .bubble.user {
      align-self: flex-end;
      background: #6c5b8c;
      color: white;
    }

    /* Pesan dari bot -> rata kiri, warna abu muda */
    .bubble.bot {
      align-self: flex-start;
      background: #eee;
      color: #333;
    }

    /* Baris input di bawah */
    #input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    #send-btn {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background: #6c5b8c;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Ruang Curhat 📝</h1>

  <div id="chat-box"></div>

  <div id="input-row">
    <input type="text" id="user-input" placeholder="Tulis apa yang kamu rasakan...">
    <button id="send-btn">Kirim</button>
  </div>

  <script>
    // ====== INI BAGIAN YANG BISA KAMU CUSTOM ======
    // Tambah, hapus, atau ubah kalimat di bawah ini sesuka kamu.
    const respons = [
      "Terima kasih sudah cerita ya. Aku di sini dengerin kamu 💜",
      "Kamu sudah berjuang keras hari ini, dan itu berarti banget.",
      "Wajar kok ngerasa begitu. Pelan-pelan aja, nggak usah buru-buru.",
      "Semangat! Satu langkah kecil hari ini tetap langkah maju.",
      "Aku bangga sama kamu karena mau nulis dan ngungkapin ini.",
      "Istirahat sejenak juga nggak apa-apa, kamu berhak tenang."
    ];
    // ================================================

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Fungsi untuk menambahkan satu gelembung pesan ke layar
    function tambahPesan(teks, jenis) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + jenis; // jenis = 'user' atau 'bot'
      bubble.textContent = teks;
      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight; // auto scroll ke bawah
    }

    // Fungsi untuk memilih satu respon acak dari daftar
    function ambilResponAcak() {
      const index = Math.floor(Math.random() * respons.length);
      return respons[index];
    }

    // Fungsi utama: dijalankan saat user kirim pesan
    function kirimPesan() {
      const teks = userInput.value.trim();
      if (teks === '') return; // kalau kosong, jangan lakukan apa-apa

      tambahPesan(teks, 'user');
      userInput.value = ''; // kosongkan kotak input

      // Beri jeda sedikit biar terasa natural, lalu tampilkan respon
      setTimeout(() => {
        tambahPesan(ambilResponAcak(), 'bot');
      }, 600);
    }

    // Jalankan kirimPesan() saat tombol diklik
    sendBtn.addEventListener('click', kirimPesan);

    // Jalankan kirimPesan() juga saat tekan Enter di keyboard
    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        kirimPesan();
      }
    });
  </script>

</body>
</html>
